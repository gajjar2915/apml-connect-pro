name: MedConnect Pro CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: medconnect_admin
          POSTGRES_PASSWORD: strong_postgres_password_2026
          POSTGRES_DB: medconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-size: 18
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: |
          npx prisma format
          npx prisma validate

      - name: Run Database Migrations (Test DB)
        env:
          DATABASE_URL: postgresql://medconnect_admin:strong_postgres_password_2026@localhost:5432/medconnect_test
        run: npx prisma migrate dev --name init

      - name: Lint Codebase
        run: npm run lint

      - name: Build Backend Server
        run: |
          cd backend
          npm run build

      - name: Build Frontend Application
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
        run: |
          cd frontend
          npm run build

  build-and-push-images:
    needs: validate-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to DockerHub / AWS ECR
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend Container
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/medconnect-backend:latest

      - name: Build & Push Frontend Container
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/medconnect-frontend:latest
