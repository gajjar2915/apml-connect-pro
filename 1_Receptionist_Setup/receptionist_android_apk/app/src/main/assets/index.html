<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>APML Receptionist Mobile App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .card {
            background: #1e293b;
            padding: 32px 24px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            max-width: 380px;
            width: 100%;
            text-align: center;
            border: 1px solid #334155;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 22px;
            color: #3b82f6;
            margin-bottom: 6px;
        }
        p {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 28px;
            line-height: 1.5;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 14px;
            background: #0f172a;
            border: 1.5px solid #334155;
            border-radius: 10px;
            color: #38bdf8;
            font-size: 17px;
            font-weight: bold;
            outline: none;
            text-align: center;
            letter-spacing: 1px;
            transition: 0.2s;
        }
        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .hint {
            margin-top: 16px;
            font-size: 11px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🏥</div>
        <h1>APML Reception Mobile</h1>
        <p>Enter your Central Server Host IP Address to connect to the Reception Desk portal.</p>
        
        <div class="form-group">
            <label>Server IP Address</label>
            <input type="text" id="ipInput" placeholder="e.g. 192.168.1.7">
        </div>

        <button class="btn" onclick="connectServer()">Connect to Reception Desk</button>

        <div class="hint">
            Make sure your phone is connected to the clinic Wi-Fi.
        </div>
    </div>

    <script>
        window.onload = function() {
            const savedIp = localStorage.getItem('reception_app_ip') || '192.168.1.7';
            document.getElementById('ipInput').value = savedIp;
            
            // Auto launch if saved IP exists
            const autoConnect = localStorage.getItem('auto_connect');
            if (autoConnect === 'true' && savedIp) {
                window.location.href = 'http://' + savedIp + ':3001/dashboard/reception';
            }
        };

        function connectServer() {
            const ip = document.getElementById('ipInput').value.trim();
            if (!ip) {
                alert('Please enter a valid IP address!');
                return;
            }
            localStorage.setItem('reception_app_ip', ip);
            localStorage.setItem('auto_connect', 'true');
            window.location.href = 'http://' + ip + ':3001/dashboard/reception';
        }
    </script>
</body>
</html>
